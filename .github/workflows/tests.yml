name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lua 5.3 for python
        run: pip install lupa

      # Chrome is installed on the GitHub runners
      - name: Run the tests
        run: python tests/run_all.py
