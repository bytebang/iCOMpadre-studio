name: Documentation

# Builds the documentation of the studio (on every push and pull request, so broken links show up before a merge)
# and publishes the studio with its documentation on GitHub Pages:
#   https://bytebang.github.io/iCOMpadre-studio/demo/           the studio as online demo
#   https://bytebang.github.io/iCOMpadre-studio/documentation/  its documentation
# The old addresses below /studio/ (the layout of the SD card) lead there.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-awesome-pages-plugin pymdown-extensions

      - name: Build the documentation
        run: mkdocs build --strict --site-dir "$PWD/site/documentation"

      - name: Add the studio as online demo
        run: |
          mkdir -p site/demo
          cp -r runtime/. site/demo/
          rm -f site/demo/main.lua site/demo/icompadre.json
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=demo/"><a href="demo/">iCOMpadre Studio</a>\n' > site/index.html

      # links to the old addresses (e.g. /studio/documentation/tutorial.html#limit) keep working, with their anchor
      - name: Forward the old addresses
        run: |
          redirect() {
            mkdir -p "$(dirname "$1")"
            printf '<!DOCTYPE html><meta charset="utf-8"><script>location.replace("%s" + location.hash)</script><a href="%s">%s</a>\n' "$2" "$2" "$2" > "$1"
          }
          redirect site/studio/index.html ../demo/
          redirect site/studio/studio/index.html ../../demo/studio/index.html
          (cd site/documentation && find . -name '*.html') | while read -r page; do
            page="${page#./}"
            up=$(echo "$page" | sed 's|[^/]*/|../|g; s|[^/]*$||')
            redirect "site/studio/documentation/$page" "../../${up}documentation/$page"
          done

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
