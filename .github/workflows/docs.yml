name: Documentation

# Builds the documentation of the studio (on every push and pull request, so broken links show up before a merge)
# and publishes the studio with its documentation on GitHub Pages, laid out like on the SD card of iCOMpadre:
#   https://bytebang.github.io/iCOMpadre-studio/studio/                the studio as online demo
#   https://bytebang.github.io/iCOMpadre-studio/studio/documentation/  its documentation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-awesome-pages-plugin pymdown-extensions

      - name: Build the documentation
        run: mkdocs build --strict --site-dir "$PWD/site/studio/documentation"

      - name: Add the studio, like on the SD card
        run: |
          cp -r runtime/. site/studio/
          rm -f site/studio/main.lua site/studio/icompadre.json
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=studio/"><a href="studio/">iCOMpadre Studio</a>\n' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
