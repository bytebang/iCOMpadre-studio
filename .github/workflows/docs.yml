name: Documentation

# Builds the documentation of the studio and publishes it as online help on GitHub Pages:
# https://bytebang.github.io/iCOMpadre-studio/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-awesome-pages-plugin pymdown-extensions

      # On the device the pages are part of the iCOMpadre userguide and may link to its other chapters (../../radios.md).
      # Those chapters are not online: such links become plain text
      - name: Links to the iCOMpadre userguide become text
        run: |
          grep -rlE '\]\(\.\./\.\./[^)]*\)' documentation | xargs -r sed -i -E 's/\[([^]]*)\]\(\.\.\/\.\.\/[^)]*\)/\1 in the iCOMpadre userguide/g'

      - name: Build the documentation
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
