<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCOMpadre Studio</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <script src="./blockly/blockly_compressed.js"></script>
  <script src="./blockly/blocks_compressed.js"></script>
  <script src="./blockly/en.js"></script>
  <script src="./msg/en.js"></script>
  <script>
    // The language of the studio: ?lang=de, otherwise the first supported language of the browser, otherwise english.
    // The same function is in ../index.html (the preloader)
    function studioLanguage(supported) {
      var wanted = [new URLSearchParams(window.location.search).get('lang')].concat(navigator.languages || [navigator.language]);
      for (var i = 0; i < wanted.length; i++) {
        var language = (wanted[i] || '').substring(0, 2).toLowerCase();
        if (supported.indexOf(language) >= 0) {
          return language;
        }
      }
      return 'en';
    }

    // The texts of another language are loaded after the english ones and overwrite them,
    // so a text which is not translated (yet) is shown in english
    var language = studioLanguage(["en", "de"]);
    document.documentElement.lang = language;
    if (language != 'en') {
      document.write('<script src="./blockly/' + language + '.js"><\/script>' +
                     '<script src="./msg/' + language + '.js"><\/script>');
    }
  </script>
  <script src="./blockly/lua_compressed.js"></script>
  <!-- the multiline text block is a plugin since blockly 12. It expects the lua generator module under this name -->
  <script>window['Blockly.Lua'] = window.lua;</script>
  <script src="./blockly/field-multilineinput.js"></script>
  <script>textMultiline.installBlock({lua: Blockly.Lua});</script>
  <script src="./filesaver.js"></script>
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <header id="header">
    <span class="branding">
      <span style="font-size: larger"><span style="font-weight: bold;"><span style="color: red;">i</span>COM</span>padre</span><br>
      The swiss army knife for iCOM radios !<br>
      <span class="byline">by OE6GUE</span>
    </span>
    <span id="status" role="status"></span>
    <nav id="toolbar">
      <button class="action" id="saveButton" title="Save the sketch on iCOMpadre (ctrl+s)" disabled><img src="img/save.svg" alt=""><span>Save</span></button>
      <button class="action" id="downloadButton" title="Download the sketch to your computer"><img src="img/export.svg" alt=""><span>Download</span></button>
      <button class="action" id="openButton" title="Open a sketch from your computer. You can also drop the file here."><img src="img/open.svg" alt=""><span>Open</span></button>
      <button class="action" id="shareButton" title="Show the sketch as text, to share it with others"><img src="img/share.svg" alt=""><span>Share</span></button>
      <button class="action" id="luaButton" title="Show the lua code which is generated from the sketch" aria-pressed="false"><img src="img/code.svg" alt=""><span>Lua</span></button>
      <input type="file" id="fileInput" accept=".json,application/json">
    </nav>
  </header>

  <div id="restoreBanner" hidden>
    <span id="restoreText"></span>
    <button id="restoreButton">Restore</button>
    <button id="discardButton">Discard</button>
  </div>

  <main id="main">
    <div id="blocklyDiv"></div>
    <aside id="luaPanel" hidden>
      <div class="panelHeader">
        <span>main.lua</span>
        <span id="luaMessage"></span>
        <button id="luaCopyButton">Copy</button>
        <button id="luaDownloadButton">Download</button>
      </div>
      <pre id="luaCode"></pre>
    </aside>
  </main>

  <dialog id="shareDialog">
    <div class="dialogContent">
      <div class="dialogHeader">
        <span><b>Share your sketch with others !</b><br>Copy the text below and share it, or paste the text of someone else's sketch and import it.</span>
        <button id="shareCloseButton" class="iconButton" title="Close this window"><img src="img/close.svg" alt="Close"></button>
      </div>
      <textarea id="shareText" spellcheck="false"></textarea>
      <div class="dialogFooter">
        <span id="shareMessage"></span>
        <button id="shareCopyButton" title="Copy the text into the clipboard"><img src="img/copy.svg" alt="">Copy</button>
        <button id="sharePasteButton" title="Paste the clipboard into the text field"><img src="img/paste.svg" alt="">Paste</button>
        <button id="shareImportButton" title="Replace the current sketch with the text"><img src="img/import.svg" alt="">Import</button>
      </div>
    </div>
  </dialog>

<script>
   
  // -------------- The toolbar -----------------
  // standard blockly categories. Everything else is registered via Studio.category()
  var baseCategories = [
          {
              "kind": "category", "name": Blockly.Msg.STUDIO_CATEGORY_LOGIC,
              "contents": [
                  {"kind": "block",  "type": "logic_compare"},
                  {"kind": "block",  "type": "logic_operation"},
                  {"kind": "block",  "type": "logic_boolean"},
                  {"kind": "block",  "type": "logic_negate"},
              ]
          },
          {"kind": "category", "name": Blockly.Msg.STUDIO_CATEGORY_CONTROL,
              "contents": [
                  {"kind": "BLOCK",  "type": "controls_if"},
                  {"kind": "BLOCK",  "type": "logic_ternary"},
                  {"kind": "BLOCK",  "type": "controls_forEach"},
                  {"kind": "BLOCK",  "type": "controls_flow_statements"},
              ]
          },
          {"kind": "category",  "name": Blockly.Msg.STUDIO_CATEGORY_MATH,
              "contents": [
                  {"kind": "BLOCK",  "type": "math_number"},
                  {"kind": "BLOCK",  "type": "math_arithmetic"},
                  {"kind": "BLOCK",  "type": "math_constrain"},
                  {"kind": "BLOCK",  "type": "math_modulo"},
                  {"kind": "BLOCK",  "type": "math_on_list"},
                  {"kind": "BLOCK",  "type": "math_number_property"},
                  {"kind": "BLOCK",  "type": "math_constant"},
                  {"kind": "BLOCK",  "type": "math_single"},
              ]
          },
          {"kind": "category",  "name": Blockly.Msg.STUDIO_CATEGORY_LISTS,
              "contents": [
                  {"kind": "BLOCK",  "type": "lists_create_with"},
                  {"kind": "BLOCK",  "type": "lists_length"},
                  {"kind": "BLOCK",  "type": "lists_isEmpty"},
                  {"kind": "BLOCK",  "type": "lists_indexOf"},
                  {"kind": "BLOCK",  "type": "lists_getIndex"},
                  {"kind": "BLOCK",  "type": "lists_setIndex"},
                  {"kind": "BLOCK",  "type": "lists_getSublist"},
                  {"kind": "BLOCK",  "type": "lists_split"},
              ]
          },
          {"kind": "category",  "name": Blockly.Msg.STUDIO_CATEGORY_TEXT,
              "contents": [
                  {"kind": "BLOCK",  "type": "text"},
                  {"kind": "BLOCK",  "type": "text_multiline"},
                  {"kind": "BLOCK",  "type": "text_join"},
                  {"kind": "BLOCK",  "type": "text_append"},
                  {"kind": "BLOCK",  "type": "text_length"},
                  {"kind": "BLOCK",  "type": "text_isEmpty"},
                  {"kind": "BLOCK",  "type": "text_indexOf"},
                  {"kind": "BLOCK",  "type": "text_count"},
                  {"kind": "BLOCK",  "type": "text_replace"},
                  {"kind": "BLOCK",  "type": "text_reverse"},
              ]
          },
          {"kind": "category",  "name": Blockly.Msg.STUDIO_CATEGORY_VARIABLES,  "custom": "VARIABLE"},
          {"kind": "category",  "name": Blockly.Msg.STUDIO_CATEGORY_FUNCTIONS,  "custom": "PROCEDURE"},
  ];
  </script>

  <!-- registration api for the block files below -->
  <script src="studio.js"></script>

  <!-- actions for base functionality of the hardware -->
  <script src="base.js"></script>

  <!-- separator -->
  <script>Studio.separator();</script>

  <!-- the radios, described with the common Icom commands. The order of the files is the order in the toolbox -->
  <script src="radio/icom.js"></script>
  <script src="radio/ic705.js"></script>
  <script src="radio/ic7610.js"></script>
  <script src="radio/ic7851.js"></script>
  <script src="radio/ic9700.js"></script>
  <script src="radio/ic718.js"></script>
  <script src="radio/ic78.js"></script>
  <script src="radio/ic2730.js"></script>
  <script src="radio/ica120e.js"></script>


  <!------------------ Rendering of the workspace code ----------------- -->
  <script>

    // -------------- Workspace -----------------
    var darkMode = window.matchMedia('(prefers-color-scheme: dark)');

    // The dark theme is based on the classic one, which already knows the iCOMpadre block styles (see studio.js)
    var darkTheme = Blockly.Theme.defineTheme('icompadre-dark', {
      'base': Blockly.Themes.Classic,
      'componentStyles': {
        'workspaceBackgroundColour': '#1e1e1e',
        'toolboxBackgroundColour': '#2d2d30',
        'toolboxForegroundColour': '#e0e0e0',
        'flyoutBackgroundColour': '#252526',
        'flyoutForegroundColour': '#cccccc',
        'flyoutOpacity': 1,
        'scrollbarColour': '#797979',
        'scrollbarOpacity': 0.4,
        'insertionMarkerColour': '#ffffff',
        'insertionMarkerOpacity': 0.3,
        'cursorColour': '#d0d0d0',
      }
    });

    function currentTheme()
    {
      return darkMode.matches ? darkTheme : Blockly.Themes.Classic;
    }

    var toolbox = Studio.buildToolbox(baseCategories);
    var blocklyDiv = document.getElementById('blocklyDiv');
    var icompadreWorkspace = Blockly.inject(blocklyDiv,
        {media: './blockly/',
        sounds: false,
        toolbox: toolbox,
        theme: currentTheme(),
        trashcan: true,
        zoom:
        {controls: true,
          startScale: 1.0},
        grid:
        {spacing: 20,
          length: 3,
          colour: darkMode.matches ? '#444' : '#ccc',
          snap: true}});

    darkMode.addEventListener('change', function() {
      icompadreWorkspace.setTheme(currentTheme());
    });

    // blockly has to be told whenever its div changes the size (window resized, lua panel shown, ...)
    new ResizeObserver(function() {
      Blockly.svgResize(icompadreWorkspace);
    }).observe(blocklyDiv);

    // ------------- UI Functions -----------------
    // Shows a message in the header. kind is one of info, ok, error
    function showStatus(text, kind)
    {
      var status = document.getElementById('status');
      status.textContent = text;
      status.className = kind || 'info';
    }

    function timeOfDay()
    {
      return new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    // Returns the current date as 2024-12-31
    function dateStamp()
    {
      var now = new Date();
      return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    }

    // Copies the text into the clipboard and resolves to true if it worked.
    // navigator.clipboard only exists on https and localhost, but the studio is served via http://icompadre.local
    function copyText(text)
    {
      if (navigator.clipboard && window.isSecureContext)
      {
        return navigator.clipboard.writeText(text).then(function() { return true; }, function() { return copyTextFallback(text); });
      }
      return Promise.resolve(copyTextFallback(text));
    }

    function copyTextFallback(text)
    {
      // An open modal dialog makes the rest of the page inert, so the helper has to live inside of it
      var host = document.querySelector('dialog[open]') || document.body;
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      host.appendChild(area);
      area.select();
      var copied = false;
      try
      {
        copied = document.execCommand('copy');
      }
      catch (error)
      {
        console.error('Copy failed', error);
      }
      host.removeChild(area);
      return copied;
    }

    // -------------- Sketch -----------------
    function sketchAsText()
    {
      return JSON.stringify(Blockly.serialization.workspaces.save(icompadreWorkspace));
    }

    function luaCode()
    {
      return Blockly.Lua.workspaceToCode(icompadreWorkspace);
    }

    // Parses the text of a sketch file, throws if it is none
    function parseSketch(text)
    {
      var sketch = JSON.parse(text);
      if (!sketch || typeof sketch !== 'object' || Array.isArray(sketch))
      {
        throw new Error('This is not an iCOMpadre sketch');
      }
      return sketch;
    }

    // Replaces the workspace with the given sketch. The user can undo this with ctrl+z.
    // If the sketch can't be loaded, the previous workspace is restored and the error is thrown.
    function replaceSketch(sketch)
    {
      var previous = Blockly.serialization.workspaces.save(icompadreWorkspace);
      try
      {
        Blockly.serialization.workspaces.load(sketch, icompadreWorkspace, {recordUndo: true});
      }
      catch (error)
      {
        console.error('Could not load the sketch', error);
        Blockly.serialization.workspaces.load(previous, icompadreWorkspace);
        icompadreWorkspace.clearUndo();
        throw error;
      }
    }

    // -------------- Unsaved changes and backup -----------------
    // The sketch as it is stored on iCOMpadre. null until it has been loaded from there.
    var savedSketch = null;

    // Unsaved changes are kept in the browser, so they survive a closed tab or a crashed browser
    var BACKUP_KEY = 'icompadre-studio.backup';
    var pendingBackup = null; // the backup which is offered to be restored

    function isDirty()
    {
      return savedSketch !== null && sketchAsText() !== savedSketch;
    }

    function writeBackup()
    {
      try
      {
        localStorage.setItem(BACKUP_KEY, JSON.stringify({'time': Date.now(), 'sketch': sketchAsText()}));
      }
      catch (error)
      {
        // no storage (private mode, ...) -> no backup
      }
    }

    function readBackup()
    {
      try
      {
        var backup = JSON.parse(localStorage.getItem(BACKUP_KEY));
        return (backup && typeof backup.sketch === 'string') ? backup : null;
      }
      catch (error)
      {
        return null;
      }
    }

    function removeBackup()
    {
      try
      {
        localStorage.removeItem(BACKUP_KEY);
      }
      catch (error)
      {
        // nothing to remove
      }
    }

    // Offers to restore the changes of an earlier session, if they were never saved
    function offerBackup()
    {
      var backup = readBackup();
      if (!backup)
      {
        return;
      }
      if (backup.sketch === savedSketch)
      {
        removeBackup();
        return;
      }
      pendingBackup = backup;
      document.getElementById('restoreText').textContent =
        'This browser has unsaved changes from ' + new Date(backup.time).toLocaleString() + '.';
      document.getElementById('restoreBanner').hidden = false;
    }

    document.getElementById('restoreButton').addEventListener('click', function() {
      document.getElementById('restoreBanner').hidden = true;
      var backup = pendingBackup;
      pendingBackup = null;
      try
      {
        replaceSketch(parseSketch(backup.sketch));
        showStatus('Restored the unsaved changes. Undo with ctrl+z.', 'info');
      }
      catch (error)
      {
        showStatus('Could not restore the unsaved changes: ' + error.message, 'error');
      }
    });

    document.getElementById('discardButton').addEventListener('click', function() {
      document.getElementById('restoreBanner').hidden = true;
      pendingBackup = null;
      removeBackup();
      onSketchChanged(); // a change made in the meantime gets its own backup
    });

    // Called (debounced) whenever the sketch changes
    function onSketchChanged()
    {
      Studio.checkEvents(icompadreWorkspace);
      updateLuaPanel();
      if (savedSketch === null)
      {
        return; // still loading, the backup must not be touched yet
      }

      var dirty = isDirty();
      document.getElementById('saveButton').classList.toggle('dirty', dirty);
      document.title = (dirty ? '● ' : '') + 'iCOMpadre Studio';
      if (pendingBackup !== null)
      {
        return; // the user has not decided yet whether to restore the backup, so keep it
      }
      if (dirty)
      {
        writeBackup();
      }
      else
      {
        removeBackup();
      }
    }

    var changeTimer = null;
    icompadreWorkspace.addChangeListener(function(event) {
      if (event.isUiEvent)
      {
        return;
      }
      clearTimeout(changeTimer);
      changeTimer = setTimeout(onSketchChanged, 300);
    });

    window.addEventListener('beforeunload', function(event) {
      if (isDirty())
      {
        event.preventDefault();
        event.returnValue = '';
      }
    });

    // -------------- Load from iCOMpadre -----------------
    // Load the latest project from the server
    async function openLastProjectFromServer()
    {
      try
      {
        var response = await fetch('/icompadre.json', {cache: 'no-cache'});
        if (response.status === 200)
        {
          Blockly.serialization.workspaces.load(parseSketch(await response.text()), icompadreWorkspace);
        }
        else
        {
          console.log('No previous workspace file found. Status ' + response.status);
        }
      }
      catch (error)
      {
        console.error('Could not load the sketch from iCOMpadre', error);
        showStatus('Could not open the sketch stored on iCOMpadre: ' + error.message, 'error');
      }

      savedSketch = sketchAsText();
      document.getElementById('saveButton').disabled = false;
      offerBackup();
      onSketchChanged();
    }
    openLastProjectFromServer();

    // -------------- Save on iCOMpadre -----------------
    // Uploads a file to the microcontroller, throws if it didn't work
    async function storeFile(filename, content)
    {
      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 20000);
      try
      {
        var response = await fetch(filename, {method: 'PUT', body: content, signal: controller.signal});
        if (!response.ok)
        {
          throw new Error(filename + ': ' + response.status + ' ' + response.statusText);
        }
      }
      catch (error)
      {
        if (error.name === 'AbortError')
        {
          throw new Error(filename + ': no answer from iCOMpadre');
        }
        if (error instanceof TypeError)
        {
          throw new Error(filename + ': iCOMpadre is not reachable');
        }
        throw error;
      }
      finally
      {
        clearTimeout(timer);
      }
    }

    // Uploads the lua file and the sketch to the microcontroller. One after the other, the SD card is slow.
    var saving = false;
    async function saveWorkspace()
    {
      var button = document.getElementById('saveButton');
      if (saving || button.disabled)
      {
        return;
      }
      saving = true;
      button.disabled = true;
      showStatus('Saving ...', 'info');

      try
      {
        var sketch = sketchAsText();
        await storeFile('/main.lua', new Blob([luaCode()], {type: 'application/x-lua'}));
        await storeFile('/icompadre.json', new Blob([sketch], {type: 'application/json'}));
        savedSketch = sketch;
        pendingBackup = null; // saving replaces the unsaved changes of an earlier session
        document.getElementById('restoreBanner').hidden = true;
        showStatus('Saved on iCOMpadre at ' + timeOfDay(), 'ok');
      }
      catch (error)
      {
        console.error('Saving failed', error);
        showStatus('Saving failed - ' + error.message, 'error');
      }
      finally
      {
        saving = false;
        button.disabled = false;
        onSketchChanged();
      }
    }

    document.getElementById('saveButton').addEventListener('click', saveWorkspace);

    document.addEventListener('keydown', function(event) {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's')
      {
        event.preventDefault();
        saveWorkspace();
      }
    });

    // ----------------import program or workspace --------------------
    function openSketchFile(file)
    {
      if (!file)
      {
        return;
      }
      var reader = new FileReader();
      reader.onload = function()
      {
        try
        {
          replaceSketch(parseSketch(reader.result));
          showStatus('Opened ' + file.name + '. Undo with ctrl+z.', 'info');
        }
        catch (error)
        {
          showStatus('Could not open ' + file.name + ' - ' + error.message, 'error');
        }
      };
      reader.onerror = function()
      {
        showStatus('Could not read ' + file.name, 'error');
      };
      reader.readAsText(file);
    }

    var fileInput = document.getElementById('fileInput');
    var openButton = document.getElementById('openButton');

    openButton.addEventListener('click', function() {
      fileInput.click();
    });

    fileInput.addEventListener('change', function() {
      openSketchFile(fileInput.files[0]);
      fileInput.value = ''; // otherwise the same file can't be opened twice
    });

    // A file can also be dropped onto the open button
    openButton.addEventListener('dragover', function(event) {
      event.stopPropagation();
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
    });

    openButton.addEventListener('drop', function(event) {
      event.stopPropagation();
      event.preventDefault();
      openSketchFile(event.dataTransfer.files[0]);
    });

    // -----------------export workspace--------------------
    document.getElementById('downloadButton').addEventListener('click', function() {
      saveAs(new Blob([sketchAsText()], {type: 'application/json'}), 'icompadre-' + dateStamp() + '.json');
    });

    // -----------------lua panel--------------------
    var LUA_PANEL_KEY = 'icompadre-studio.luaPanel';
    var luaPanel = document.getElementById('luaPanel');

    function setLuaPanelVisible(visible)
    {
      luaPanel.hidden = !visible;
      document.getElementById('luaButton').setAttribute('aria-pressed', String(visible));
      try
      {
        localStorage.setItem(LUA_PANEL_KEY, visible ? 'shown' : 'hidden');
      }
      catch (error)
      {
        // the panel is just hidden again next time
      }
      updateLuaPanel();
    }

    function updateLuaPanel()
    {
      if (luaPanel.hidden)
      {
        return;
      }
      try
      {
        document.getElementById('luaCode').textContent = luaCode();
      }
      catch (error)
      {
        document.getElementById('luaCode').textContent = '-- The lua code could not be generated: ' + error.message;
      }
    }

    function showLuaMessage(text)
    {
      var message = document.getElementById('luaMessage');
      message.textContent = text;
      setTimeout(function() { message.textContent = ''; }, 3000);
    }

    document.getElementById('luaButton').addEventListener('click', function() {
      setLuaPanelVisible(luaPanel.hidden);
    });

    document.getElementById('luaCopyButton').addEventListener('click', function() {
      copyText(luaCode()).then(function(copied) {
        showLuaMessage(copied ? 'Copied' : 'Select the code and press ctrl+c');
      });
    });

    document.getElementById('luaDownloadButton').addEventListener('click', function() {
      saveAs(new Blob([luaCode()], {type: 'application/x-lua'}), 'main.lua');
    });

    try
    {
      setLuaPanelVisible(localStorage.getItem(LUA_PANEL_KEY) === 'shown');
    }
    catch (error)
    {
      setLuaPanelVisible(false);
    }

    // -----------------sharing--------------------
    var shareDialog = document.getElementById('shareDialog');
    var shareText = document.getElementById('shareText');

    function showShareMessage(text, kind)
    {
      var message = document.getElementById('shareMessage');
      message.textContent = text;
      message.className = kind || 'info';
    }

    document.getElementById('shareButton').addEventListener('click', function() {
      shareText.value = sketchAsText();
      showShareMessage('');
      shareDialog.showModal();
      shareText.select();
    });

    document.getElementById('shareCloseButton').addEventListener('click', function() {
      shareDialog.close();
    });

    // A click next to the dialog closes it (escape works as well)
    shareDialog.addEventListener('click', function(event) {
      if (event.target === shareDialog)
      {
        shareDialog.close();
      }
    });

    document.getElementById('shareCopyButton').addEventListener('click', function() {
      copyText(shareText.value).then(function(copied) {
        showShareMessage(copied ? 'Copied into the clipboard' : 'Select the text and press ctrl+c', copied ? 'ok' : 'info');
      });
    });

    document.getElementById('sharePasteButton').addEventListener('click', function() {
      function pasteManually()
      {
        shareText.value = '';
        shareText.focus();
        showShareMessage('Press ctrl+v to paste the text', 'info');
      }

      if (navigator.clipboard && navigator.clipboard.readText && window.isSecureContext)
      {
        navigator.clipboard.readText().then(function(text) {
          shareText.value = text;
          showShareMessage('');
        }, pasteManually);
      }
      else
      {
        pasteManually();
      }
    });

    document.getElementById('shareImportButton').addEventListener('click', function() {
      try
      {
        replaceSketch(parseSketch(shareText.value));
        shareDialog.close();
        showStatus('Imported the sketch. Undo with ctrl+z.', 'info');
      }
      catch (error)
      {
        showShareMessage('Could not import - ' + error.message, 'error');
      }
    });

  </script>
</body>
</html>
